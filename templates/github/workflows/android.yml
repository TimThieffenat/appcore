# Builds the test Android APK in the cloud (GitHub Actions), with nothing to install.
# Base file (appcore/templates/github/workflows/): the same for every
# app, everything specific to the app comes from its app_info.py.
# Run: the repository's "Actions" tab > "Android APK" > "Run workflow".
# The APK can then be downloaded from the run's "Artifacts".
#
# Signing: always the same key (see appcore/android/signing_key.sh), so that
# the phone accepts the new version over the old one. With the
# KEYSTORE_B64 and KEYSTORE_PASSWORD secrets (Google Play upload key), it is
# that key; without them, a test key kept in GitHub's cache.
#
# The base is a submodule (appcore/): if it is in a private repository, add
# the APPCORE_TOKEN secret (GitHub token with read access to that repository
# and to the app's).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      target_api:
        description: "Target Android version (targetSdk). 36 = Android 16, required by Google Play"
        required: false
        default: "36"
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      APPCORE_ANDROID_API: ${{ inputs.target_api || '36' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.APPCORE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: App settings (app_info.py)
        run: python3 appcore/android/app_config.py . --github-env >> "$GITHUB_ENV"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config \
            openjdk-17-jdk zip unzip ccache curl git
          pip install uv

      - name: Cache Android SDK / NDK / wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.pyside6_android_deploy
            ~/.buildozer
            build/android/*.whl
          key: android-pyside6.12.0-ndk-r28c-v1
          restore-keys: |
            android-pyside6.12.0-ndk-r28c-

      - name: Restore the test signing key
        id: debug_key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.APP_KEY_ALIAS }}-debug-keystore-v1

      - name: Signing key (the same for every build)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash appcore/android/signing_key.sh

      - name: Build APK
        run: bash appcore/android/build_apk.sh

      - name: Keep the test signing key
        if: steps.key.outputs.kind == 'debug' && steps.debug_key.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.APP_KEY_ALIAS }}-debug-keystore-v1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: dist/*.apk
          retention-days: 7   # the APK (~150 MB) is deleted after 7 days: 500 MB quota
