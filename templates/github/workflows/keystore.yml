# Run ONLY ONCE (Actions > Create keystore > Run workflow): creates the
# upload signing key (alias KEY_ALIAS of app_info.py). The repository must be PRIVATE.
# Download the artifact, keep upload.jks and its password somewhere safe (2 copies),
# then put the content of upload.jks.b64 in the KEYSTORE_B64 secret and the
# password in KEYSTORE_PASSWORD.
name: Create keystore
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Key password (min. 8 characters, write it down!)"
        required: true
jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.APPCORE_TOKEN || github.token }}
      - name: App settings (app_info.py)
        run: python3 appcore/android/app_config.py . --github-env >> "$GITHUB_ENV"
      - name: Generate
        env:
          PW: ${{ inputs.password }}
        run: |
          keytool -genkeypair -keystore upload.jks -alias "$APP_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=$APP_NAME, O=$APP_NAME, C=FR"
          base64 -w0 upload.jks > upload.jks.b64
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-keystore
          path: |
            upload.jks
            upload.jks.b64
          retention-days: 1
