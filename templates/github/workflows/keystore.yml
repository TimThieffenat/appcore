# À lancer UNE SEULE FOIS (Actions > Create keystore > Run workflow) : crée la
# clé de signature d'envoi (alias KEY_ALIAS de app_info.py). Le dépôt doit être PRIVÉ.
# Télécharge l'artefact, garde upload.jks et son mot de passe en lieu sûr (2 copies),
# puis mets le contenu de upload.jks.b64 dans le secret KEYSTORE_B64 et le mot
# de passe dans KEYSTORE_PASSWORD.
name: Create keystore
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Mot de passe de la clé (min. 8 caractères, note-le !)"
        required: true
jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.APPCORE_TOKEN || github.token }}
      - name: App settings (app_info.py)
        run: python3 appcore/android/app_config.py . --github-env >> "$GITHUB_ENV"
      - name: Generate
        env:
          PW: ${{ inputs.password }}
        run: |
          keytool -genkeypair -keystore upload.jks -alias "$APP_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=$APP_NAME, O=$APP_NAME, C=FR"
          base64 -w0 upload.jks > upload.jks.b64
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-keystore
          path: |
            upload.jks
            upload.jks.b64
          retention-days: 1
